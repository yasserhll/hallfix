[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hallfix"
version = "0.1.0"
description = "Hallfix — Safe Linux System Doctor & Environment Manager"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hallfix Contributors" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[project.scripts]
hallfix = "hallfix.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hallfix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = ["integration: exercises the real host (network/subprocess), not a fake root"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "S",             # bandit (security)
    "C4",            # comprehensions
    "SIM",           # simplify
]
ignore = [
    "S101", # allow assert in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
