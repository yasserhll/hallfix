name: Release

# Triggered by pushing a version tag (e.g. `git tag v0.1.0 && git push --tags`).
# Deliberately publishes to a GitHub Release only, not PyPI — spec §74:
# "do not implement every packaging format in the MVP" and never promote
# `curl | sh` until there's a mature, secure installation mechanism.
# PyPI publishing needs its own account/trusted-publisher setup, which is
# a decision for a human to make, not something to wire up unasked.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"

      # Re-run the full quality gate before releasing anything — a tag
      # push skips PR review, so nothing here may assume CI already
      # vetted this exact commit.
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

      - run: python -m build

      - name: Verify the built wheel actually installs and runs
        run: |
          python -m venv /tmp/verify-venv
          /tmp/verify-venv/bin/pip install dist/*.whl
          /tmp/verify-venv/bin/hallfix version

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
